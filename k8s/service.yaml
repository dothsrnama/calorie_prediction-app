apiVersion: v1
kind: Service
metadata:
  name: calorie-app-service
spec:
  type: NodePort  # Use LoadBalancer if running on a managed cloud cluster (EKS/GKE/AKS)
  selector:
    app: calorie-app
  ports:
    - name: fastapi
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: streamlit
      protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30851
