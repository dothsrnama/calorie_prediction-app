apiVersion: apps/v1
kind: Deployment
metadata:
  name: calorie-app-deployment
  labels:
    app: calorie-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calorie-app
  template:
    metadata:
      labels:
        app: calorie-app
    spec:
      imagePullSecrets:
        - name:k8s_ghcr_secret
      containers:
        - name: calorie-app
          image: ghcr.io/dothsrnama/calorie_prediction-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: fastapi
            - containerPort: 8501
              name: streamlit
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
